services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glchub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glchub}
      POSTGRES_DB: glchub
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # acesso local para dev/backup; não exposto publicamente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glchub -d glchub"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: tools
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://glchub:${POSTGRES_PASSWORD:-glchub}@db:5432/glchub?schema=public
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://glchub:${POSTGRES_PASSWORD:-glchub}@db:5432/glchub?schema=public
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: tools
    restart: unless-stopped
    command: npx tsx scripts/worker.ts
    environment:
      DATABASE_URL: postgresql://glchub:${POSTGRES_PASSWORD:-glchub}@db:5432/glchub?schema=public
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dbdata:
